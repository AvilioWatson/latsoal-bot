name: Manual UTBK Content

on:
  workflow_dispatch:
    inputs:
      mapel:
        description: Subtes UTBK/SNBT
        required: true
        default: Penalaran Umum
        type: choice
        options:
          - Penalaran Umum
          - Pengetahuan dan Pemahaman Umum
          - Pemahaman Bacaan dan Menulis
          - Pengetahuan Kuantitatif
          - Literasi Bahasa Indonesia
          - Literasi Bahasa Inggris
          - Penalaran Matematika
      topik:
        description: Topik
        required: true
        default: Penalaran deduktif
      level:
        description: Level
        required: true
        default: sedang
        type: choice
        options:
          - mudah
          - sedang
          - sulit
      mode:
        description: Mode generator
        required: true
        default: auto
        type: choice
        options:
          - auto
          - draft

jobs:
  generate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run quality checks
        shell: powershell
        run: npm.cmd run check

      - name: Generate content
        shell: powershell
        run: |
          python content_generator.py `
            --mapel "${{ inputs.mapel }}" `
            --topik "${{ inputs.topik }}" `
            --level "${{ inputs.level }}" `
            --mode "${{ inputs.mode }}"

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: utbk-content-output
          path: outputs/
          retention-days: 7
